<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" width="760" height="630" font-family="sans-serif">
<title>How reviewer2-repellent works: install, run, choose in changes.pdf, apply, present</title>
<desc>Five steps. 1 Install: one command installs the skill, then ask your agent to set up the tools following SETUP.md; it installs nothing without your yes. 2 Run: ask "Run Reviewer 2 on my paper. It goes to SIGIR 2027."; it writes reviewer2-repellent/date/ with report.md, changes.pdf and corrected/. 3 Choose: in changes.pdf every change is marked and has a box; tick #7, leave #12 ticked, untick #31, then save the PDF. 4 Apply: ask "Apply my choices in .../changes.pdf"; corrected/ is updated with exactly the chosen changes. 5 Present the accepted paper at the conference: a researcher relaxes on a beach deckchair with a cocktail. A side panel explains the colours used in changes.pdf.</desc>
<style>
.a{animation:25s ease-in-out infinite}
.p{animation-name:dim}
.s2,.s2 .a{animation-delay:-20s}.s3,.s3 .a{animation-delay:-15s}.s4,.s4 .a{animation-delay:-10s}.s5,.s5 .a{animation-delay:-5s}
.t2{animation-name:t2}.t6{animation-name:t6}.t9{animation-name:t9}.t12{animation-name:t12}.t15{animation-name:t15}.t18{animation-name:t18}
.k7{animation-name:k7}.k31{animation-name:k31}.hov{animation-name:hov}
.cur{animation-name:cur;transform-box:fill-box}
.rip{transform-box:fill-box;transform-origin:center}.r7{animation-name:r7}.r31{animation-name:r31}
.pop{animation-name:pop}
.sun{animation-name:sun;transform-box:fill-box}
.blink{animation:1s steps(1) infinite blink}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes dim{0%,17.6%{opacity:1}20.8%,96%{opacity:.28}100%{opacity:1}}
@keyframes t2{0%,1.6%{opacity:0}4%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes t6{0%,4.8%{opacity:0}7.2%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes t9{0%,7.2%{opacity:0}9.6%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes t12{0%,9.6%{opacity:0}12%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes t15{0%,12%{opacity:0}14.4%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes t18{0%,14%{opacity:0}16%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes k7{0%,4.4%{opacity:0}4.8%,90%{opacity:1}93%,100%{opacity:0}}
@keyframes k31{0%,13.2%{opacity:1}13.6%,90%{opacity:0}93%,100%{opacity:1}}
@keyframes hov{0%,7.4%{opacity:0}8.2%,10%{opacity:1}11%,100%{opacity:0}}
@keyframes r7{0%,4.4%{opacity:0;transform:scale(1)}4.6%{opacity:1;transform:scale(1)}6.6%,100%{opacity:0;transform:scale(3.2)}}
@keyframes r31{0%,13.2%{opacity:0;transform:scale(1)}13.4%{opacity:1;transform:scale(1)}15.4%,100%{opacity:0;transform:scale(3.2)}}
@keyframes cur{0%,0.8%{opacity:0;transform:translate(60px,-60px) scale(1)}2%{opacity:1;transform:translate(60px,-60px) scale(1)}4%{transform:translate(-25px,-45px) scale(1)}4.4%{transform:translate(-25px,-45px) scale(0.8)}4.8%,5.6%{transform:translate(-25px,-45px) scale(1)}7.6%,10.4%{transform:translate(11.5px,-99.5px) scale(1)}12.8%{transform:translate(0px,0px) scale(1)}13.2%{transform:translate(0px,0px) scale(0.8)}13.6%{transform:translate(0px,0px) scale(1)}17.6%{opacity:1;transform:translate(0px,0px) scale(1)}19.2%,100%{opacity:0;transform:translate(0px,0px) scale(1)}}
@keyframes pop{0%,7.2%{opacity:0;transform:translate(0,16px)}10.4%,90%{opacity:1;transform:translate(0,0)}93%,100%{opacity:0;transform:translate(0,16px)}}
@keyframes sun{0%{transform:translate(0,40px)}12%,90%{transform:translate(0,0)}96%,100%{transform:translate(0,40px)}}
@media (prefers-reduced-motion:reduce){.a,.blink{animation:none}}
</style>
<defs>
<g id="card"><rect width="240" height="300" rx="10" fill="#fdfbf4" stroke="#0b3a26" stroke-width="2"/></g>
<g id="arrow"><path d="M0 0 L0 15 L4 11 L7 18 L9.5 17 L6.5 10 L12 10 Z" fill="#fff" stroke="#16181d" stroke-width="1.3" stroke-linejoin="round"/></g>
</defs>

<!-- 1 Install -->
<g class="a p s1" transform="translate(10 10)">
<use href="#card"/>
<circle cx="24" cy="26" r="13" fill="#0b3a26"/><text x="24" y="31" text-anchor="middle" font-weight="700" font-size="14" fill="#fff">1</text>
<text x="45" y="31" font-weight="700" font-size="16" fill="#16181d">Install</text>
<rect x="14" y="50" width="212" height="184" rx="7" fill="#16181d"/>
<circle cx="26" cy="61" r="3.5" fill="#c80000"/><circle cx="37" cy="61" r="3.5" fill="#e0a000"/><circle cx="48" cy="61" r="3.5" fill="#1f8a5b"/>
<g font-family="monospace" font-size="10.5">
<!-- always visible: the one-line install, so the terminal is never empty -->
<text x="22" y="84" fill="#b8c0c8">$ curl …/install.sh | bash</text>
<path d="M23 94 L26 97 L31 90" fill="none" stroke="#7fdc9f" stroke-width="1.8" stroke-linecap="round"/><text x="35" y="98" fill="#7fdc9f">skill installed</text>
<rect class="blink" x="22" y="106" width="6" height="11" fill="#8fd0ff"/>
<g class="a t2"><rect x="14" y="104" width="30" height="16" fill="#16181d"/><text x="22" y="116" fill="#8fd0ff">&gt; Set up reviewer2-repellent</text><text x="22" y="130" fill="#8fd0ff">  following its SETUP.md</text></g>
<g class="a t6" fill="#e8e8e8"><path d="M23 146 L26 149 L31 142" fill="none" stroke="#7fdc9f" stroke-width="1.8" stroke-linecap="round"/><text x="35" y="150">python3, latexmk, poppler</text><text x="35" y="164" fill="#ffb347">refchecker: missing</text></g>
<g class="a t9" fill="#e8e8e8"><text x="22" y="186">Install refchecker? [y/n]</text></g>
<g class="a t12"><text x="22" y="204" fill="#8fd0ff">&gt; y</text><path d="M23 218 L26 221 L31 214" fill="none" stroke="#7fdc9f" stroke-width="1.8" stroke-linecap="round"/><text x="35" y="222" fill="#7fdc9f">ready</text></g>
</g>
<text x="120" y="262" text-anchor="middle" font-size="11.5" fill="#333">One command, then your agent sets up</text>
<text x="120" y="279" text-anchor="middle" font-size="11.5" fill="#333">the tools: nothing without your yes.</text>
</g>

<!-- 2 Run -->
<g class="a p s2" transform="translate(260 10)">
<use href="#card"/>
<circle cx="24" cy="26" r="13" fill="#0b3a26"/><text x="24" y="31" text-anchor="middle" font-weight="700" font-size="14" fill="#fff">2</text>
<text x="45" y="31" font-weight="700" font-size="16" fill="#16181d">Run</text>
<g class="a t2">
<path d="M22 52 H218 a8 8 0 0 1 8 8 V98 a8 8 0 0 1 -8 8 H60 L48 118 L48 106 H22 a8 8 0 0 1 -8 -8 V60 a8 8 0 0 1 8 -8 Z" fill="#e6f1fb" stroke="#2a7fc6" stroke-width="1.5"/>
<text x="24" y="74" font-size="12" fill="#16181d">Run Reviewer 2 on my paper.</text>
<text x="24" y="93" font-size="12" fill="#16181d">It goes to SIGIR 2027.</text>
</g>
<g class="a t6">
<path d="M18 138 h22 l6 6 h44 v8 h-72 Z" fill="#e0a000"/><rect x="18" y="146" width="72" height="20" rx="2" fill="#f2c14e"/>
<text x="96" y="160" font-family="monospace" font-size="10" fill="#16181d">reviewer2-repellent/</text>
<text x="96" y="173" font-family="monospace" font-size="10" fill="#555">  &lt;date&gt;/</text>
</g>
<g font-family="monospace" font-size="11" fill="#16181d">
<g class="a t9"><path d="M36 182 V196 H48" fill="none" stroke="#999"/><rect x="52" y="188" width="10" height="13" fill="#fff" stroke="#555"/><text x="68" y="199">report.md</text></g>
<g class="a t12"><path d="M36 196 V218 H48" fill="none" stroke="#999"/><rect x="52" y="210" width="10" height="13" fill="#fff" stroke="#c80000"/><text x="68" y="221" fill="#c80000" font-weight="700">changes.pdf</text></g>
<g class="a t15"><path d="M36 218 V240 H48" fill="none" stroke="#999"/><rect x="52" y="233" width="12" height="9" rx="1" fill="#f2c14e"/><text x="68" y="243">corrected/</text></g>
</g>
<text x="120" y="273" text-anchor="middle" font-size="11.5" fill="#333">Open your agent in the paper's folder.</text>
</g>

<!-- 3 Choose -->
<g class="a p s3" transform="translate(510 10)">
<use href="#card"/>
<circle cx="24" cy="26" r="13" fill="#0b3a26"/><text x="24" y="31" text-anchor="middle" font-weight="700" font-size="14" fill="#fff">3</text>
<text x="45" y="31" font-weight="700" font-size="16" fill="#16181d">Choose</text>
<rect x="8" y="44" width="224" height="210" rx="5" fill="#e4e2dc" stroke="#888"/>
<path d="M8 49 a5 5 0 0 1 5 -5 H227 a5 5 0 0 1 5 5 V62 H8 Z" fill="#cfccc4"/>
<path d="M14 47 h12 l4 4 v9 h-16 Z" fill="#c80000"/><text x="22" y="58" text-anchor="middle" font-size="5.5" font-weight="700" fill="#fff">PDF</text>
<text x="35" y="57.5" font-size="10.5" font-weight="700" fill="#16181d">changes.pdf</text>
<g fill="#888"><circle cx="204" cy="53" r="2.5"/><circle cx="214" cy="53" r="2.5"/><circle cx="224" cy="53" r="2.5"/></g>
<g transform="translate(-2 20)">
<rect x="14" y="48" width="140" height="180" fill="#fff" stroke="#999"/>
<g fill="#d5d5d5"><rect x="24" y="60" width="104" height="4"/><rect x="24" y="70" width="112" height="4"/><rect x="24" y="80" width="98" height="4"/><rect x="24" y="126" width="112" height="4"/><rect x="24" y="136" width="90" height="4"/><rect x="24" y="168" width="108" height="4"/><rect x="24" y="178" width="112" height="4"/><rect x="24" y="210" width="100" height="4"/></g>
<!-- hover highlight on #12 -->
<rect class="a hov" opacity="0" x="18" y="87" width="136" height="20" rx="3" fill="#2a7fc6" fill-opacity=".16" stroke="#2a7fc6" stroke-opacity=".5"/>
<!-- the red change #12 -->
<text x="22" y="102" font-size="10.5" fill="#16181d">MRR</text>
<text x="50" y="102" font-size="10.5" fill="#c80000">42.1</text><path d="M49 99 H73" stroke="#c80000" stroke-width="1.2"/>
<text x="78" y="102" font-size="10.5" fill="#c80000" font-weight="700" text-decoration="underline">41.2</text>
<rect x="112" y="91" width="22" height="13" rx="3" fill="#c80000"/><text x="123" y="101" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">#12</text>
<!-- checkbox -->
<rect x="137" y="91" width="13" height="13" rx="2" fill="#fff" stroke="#16181d" stroke-width="1.4"/>
<path d="M139.5 97.5 L142.5 101 L148 93.5" fill="none" stroke="#c80000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<!-- margin note (11 px at 760 px display width) -->
<path d="M150 97 H156" stroke="#2a7fc6" stroke-width="1"/>
<rect x="156" y="80" width="77" height="50" rx="4" fill="#d9ecfa" stroke="#2a7fc6"/>
<text x="160" y="95" font-size="11" font-weight="700" fill="#16181d">#12 Table 3</text><text x="160" y="109" font-size="11" fill="#16181d">says 41.2</text><text x="160" y="123" font-size="11" fill="#555">(text: 42.1)</text>
<!-- other marks -->
<text x="24" y="156" font-size="10.5" fill="#16181d">we</text><text x="40" y="156" font-size="10.5" fill="#e07b00" font-weight="700" text-decoration="underline">report</text>
<rect x="76" y="146" width="21" height="12" rx="3" fill="#e07b00"/><text x="86.5" y="155" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">#7</text>
<rect x="101" y="146" width="12" height="12" rx="2" fill="#fff" stroke="#16181d" stroke-width="1.2"/><path class="a k7" d="M103.5 152.5 L106.5 156 L112 148.5" fill="none" stroke="#e07b00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="a rip r7" opacity="0" cx="107" cy="152" r="5" fill="none" stroke="#2a7fc6" stroke-width="1.5"/>
<text x="24" y="200" font-size="10.5" fill="#16181d">which</text><text x="56" y="200" font-size="10.5" fill="#7b3fa0" font-weight="700" text-decoration="underline">clearly</text>
<rect x="98" y="190" width="23" height="12" rx="3" fill="#7b3fa0"/><text x="109.5" y="199" text-anchor="middle" font-size="8.5" font-weight="700" fill="#fff">#31</text>
<rect x="125" y="190" width="12" height="12" rx="2" fill="#fff" stroke="#16181d" stroke-width="1.2"/><path class="a k31" opacity="0" d="M127.5 196.5 L130.5 200 L136 192.5" fill="none" stroke="#7b3fa0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="a rip r31" opacity="0" cx="131" cy="196" r="5" fill="none" stroke="#2a7fc6" stroke-width="1.5"/>
<!-- cursor -->
<g transform="translate(132 197)"><g class="a cur"><use href="#arrow"/></g></g>
<!-- save -->
<g class="a t18" transform="translate(176 160)">
<rect width="34" height="34" rx="4" fill="#2a7fc6"/><rect x="7" y="3" width="20" height="11" fill="#fff"/><rect x="21" y="5" width="4" height="7" fill="#2a7fc6"/><rect x="6" y="19" width="22" height="13" rx="1" fill="#e6f1fb"/>
<text x="17" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#2a7fc6">Save</text>
</g>
</g>
<text x="120" y="275" text-anchor="middle" font-size="11.5" fill="#333">In changes.pdf, ticked = applied.</text>
<text x="120" y="291" text-anchor="middle" font-size="11.5" fill="#333">Click a box to change it, then save.</text>
</g>

<!-- 4 Apply -->
<g class="a p s4" transform="translate(10 320)">
<use href="#card"/>
<circle cx="24" cy="26" r="13" fill="#0b3a26"/><text x="24" y="31" text-anchor="middle" font-weight="700" font-size="14" fill="#fff">4</text>
<text x="45" y="31" font-weight="700" font-size="16" fill="#16181d">Apply</text>
<g class="a t2">
<path d="M22 52 H218 a8 8 0 0 1 8 8 V98 a8 8 0 0 1 -8 8 H60 L48 118 L48 106 H22 a8 8 0 0 1 -8 -8 V60 a8 8 0 0 1 8 -8 Z" fill="#e6f1fb" stroke="#2a7fc6" stroke-width="1.5"/>
<text x="24" y="74" font-size="12" fill="#16181d">Apply my choices in</text>
<text x="24" y="93" font-size="12" fill="#16181d" font-family="monospace">…/changes.pdf</text>
</g>
<g class="a t9">
<circle cx="120" cy="166" r="30" fill="#1f8a5b"/>
<path d="M105 166 L116 177 L136 154" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g class="a t12">
<text x="120" y="218" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="700" fill="#1f8a5b">corrected/ updated</text>
</g>
<text x="120" y="256" text-anchor="middle" font-size="11.5" fill="#333">Exactly the changes you ticked.</text>
<text x="120" y="273" text-anchor="middle" font-size="11.5" fill="#333">Copy it over your sources.</text>
</g>

<!-- 5 Present -->
<g class="a p s5" transform="translate(260 320)">
<use href="#card"/>
<circle cx="24" cy="26" r="13" fill="#0b3a26"/><text x="24" y="31" text-anchor="middle" font-weight="700" font-size="14" fill="#fff">5</text>
<text x="45" y="31" font-weight="700" font-size="16" fill="#16181d">Present</text>
<clipPath id="bc"><rect x="12" y="46" width="216" height="190" rx="8"/></clipPath>
<g clip-path="url(#bc)">
<rect x="12" y="46" width="216" height="190" fill="#d9ecfa"/>
<g class="a sun"><circle cx="190" cy="78" r="16" fill="#f2c14e"/></g>
<path d="M12 132 Q40 126 68 132 T124 132 T180 132 T236 132 V170 H12 Z" fill="#5fa8dc"/>
<path d="M12 146 Q40 141 68 146 T124 146 T180 146 T236 146" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/>
<path d="M12 168 Q80 156 228 166 V236 H12 Z" fill="#f8f1df"/>
<g transform="translate(7 0)">
<!-- palm -->
<path d="M22 232 Q20 170 46 112" fill="none" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/>
<g fill="#1f8a5b"><path d="M46 112 Q22 96 4 112 Q24 104 46 114 Z"/><path d="M46 112 Q68 94 88 108 Q66 102 46 114 Z"/><path d="M46 112 Q38 86 18 84 Q38 94 44 112 Z"/><path d="M46 112 Q58 84 78 84 Q58 94 48 112 Z"/><path d="M46 112 Q36 124 28 140 Q38 124 48 113 Z"/></g>
<circle cx="49" cy="117" r="3.5" fill="#8a5a2b"/><circle cx="43" cy="118" r="3.5" fill="#8a5a2b"/>
<!-- sun lounger: backrest on the left, seat to the right -->
<g stroke="#8a5a2b" stroke-width="2.5" stroke-linecap="round"><path d="M120 208 L116 226"/><path d="M200 208 L204 226"/><path d="M106 186 L128 208"/></g>
<path d="M95 172 L104 168 L124 202 L204 202 L204 208 L118 208 Z" fill="#c80000"/>
<path d="M100 178 L106 175 M108 191 L114 188 M140 202 V208 M164 202 V208 M188 202 V208" stroke="#fff" stroke-width="4"/>
<!-- researcher lying on it, head on the backrest, legs on the seat -->
<path d="M106 172 L122 198" stroke="#2a7fc6" stroke-width="13" stroke-linecap="round"/>
<path d="M122 198 L142 197" stroke="#0b3a26" stroke-width="11" stroke-linecap="round"/>
<path d="M142 196 L160 184 L184 197" fill="none" stroke="#f1c27d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="188" cy="196" rx="5" ry="3" fill="#f1c27d"/>
<circle cx="103" cy="159" r="9" fill="#f1c27d"/>
<path d="M94 158 A9 9 0 0 1 108 151 L103 156 Z" fill="#16181d"/>
<rect x="104" y="156" width="9" height="4" rx="1.5" fill="#16181d"/>
<!-- arm in front, holding the cocktail -->
<path d="M110 180 L124 186 L134 172" fill="none" stroke="#f1c27d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M126 152 H146 L136 164 Z" fill="#f2a0c0" stroke="#16181d" stroke-width="1"/>
<path d="M136 164 V172 M131 172 H141" stroke="#16181d" stroke-width="1.3"/>
<circle cx="143" cy="152" r="3.5" fill="#9bd35a" stroke="#1f8a5b" stroke-width=".8"/>
<path d="M131 152 L127 141" stroke="#16181d" stroke-width="1"/><path d="M120 144 Q127 134 134 142 Z" fill="#e07b00"/>
<!-- ACCEPTED sign planted in the sand -->
<g class="a pop">
<path d="M62 210 V234" stroke="#8a5a2b" stroke-width="3"/>
<rect x="34" y="193" width="56" height="19" rx="2" fill="#fff" stroke="#1f8a5b" stroke-width="1.8"/>
<text x="62" y="206.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f8a5b">ACCEPTED</text>
</g>
</g>
</g>
<rect x="12" y="46" width="216" height="190" rx="8" fill="none" stroke="#0b3a26" stroke-opacity=".3"/>
<text x="120" y="262" text-anchor="middle" font-size="11.5" fill="#333">Present the accepted paper</text>
<text x="120" y="279" text-anchor="middle" font-size="11.5" fill="#333">at the conference.</text>
</g>

<!-- caption panel: the colours of changes.pdf (static) -->
<g transform="translate(510 320)">
<rect width="240" height="300" rx="10" fill="#f3f1ea" stroke="#0b3a26" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="20" y="34" font-weight="700" font-size="15" fill="#16181d">In changes.pdf</text>
<g font-size="12.5" fill="#16181d">
<rect x="20" y="58" width="22" height="13" rx="3" fill="#c80000"/><text x="52" y="69">fix</text>
<rect x="20" y="84" width="22" height="13" rx="3" fill="#e07b00"/><text x="52" y="95">fix to confirm</text>
<rect x="20" y="110" width="22" height="13" rx="3" fill="#7b3fa0"/><text x="52" y="121">optional wording</text>
<rect x="20" y="136" width="22" height="13" rx="3" fill="#d9ecfa" stroke="#2a7fc6"/><text x="52" y="147">note in the margin</text>
<rect x="24" y="166" width="13" height="13" rx="2" fill="#fff" stroke="#16181d" stroke-width="1.4"/><path d="M26.5 172.5 L29.5 176 L35 168.5" fill="none" stroke="#16181d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="177">will be applied</text>
<rect x="24" y="192" width="13" height="13" rx="2" fill="#fff" stroke="#16181d" stroke-width="1.4"/><text x="52" y="203">will not be applied</text>
</g>
<path d="M20 226 H220" stroke="#0b3a26" stroke-opacity=".25"/>
<g font-size="11.5" fill="#333">
<text x="20" y="250">Your sources are never touched:</text>
<text x="20" y="267">every fix goes to a copy, and</text>
<text x="20" y="284">each one carries its evidence.</text>
</g>
</g>
</svg>
